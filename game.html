<!DOCTYPE html>
<html lang="KO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumid</title>

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/reset.min.css">
    <link rel="stylesheet" href="assets/css/font.css">

    <link rel="stylesheet" href="assets/css/common.css">
    <link rel="stylesheet" href="assets/css/game.css">
    <link rel="stylesheet" href="assets/css/game-breakpoint.css">

</head>
<body>
    <!-- header -->
    <header>
        <div class="header header-pc">
            <div class="container header-container">
                <h1 class="logo">
                    <a href="/">
                        <img src="assets/images/Lumid-logo.svg" alt="루미드 로고">
                    </a>
                </h1>
                <nav>
                    <div class="menu-list-wrap">
                        <ul class="menu-list">
                            <li class="menu">
                                <a href="./studio.html">회사소개</a>
                            </li>
                            <li class="menu game">
                                <a href="./game.html">게임소개</a>
                            </li>
                            <li class="menu">
                                <a href="./news.html">새소식</a>
                            </li>
                            <li class="menu">
                                <a href="./career.html">채용</a>
                            </li>
                        </ul>
                    </div>
                </nav>
                <div class="translation">
                    <div class="trans-top">
                        <p>KO</p>
                        <button class="trans-down-btn">
                            <img src="assets/images/down-icon.svg" alt="down">
                        </button>
                    </div>
                    <div class="trans-down-list">
                        <ul class="trans-option">
                            <li>
                                <a href="#">
                                    EN
                                </a>
                            </li>
                            <li>
                                <a href="#">
                                    JP
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
        <!-- mo -->
        <div class="header header-mo">
            <div class="header-container">
                <h2 class="logo-mo">
                    <a href="/">
                        <img src="assets/images/Lumid-logo.svg" alt="루미드 로고">
                    </a>
                </h2>
                <button class="menu-btn">
                    <svg width="30" height="30" viewBox="0 0 18 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 1H17M4 7H17M7 13H17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            <div class="header-mo mo-nav">
                <div class="header-container">
                    <h2 class="logo-mo">
                        <a href="/">
                            <img src="assets/images/Lumid-logo.svg" alt="루미드 로고">
                        </a>
                    </h2>
                    <button class="close-btn">
                        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9.725 7.075L14.1375 11.4875L11.4875 14.1375L7.075 9.725L2.65 14.15L0 11.5L4.425 7.075L0 2.65L2.65 0L7.075 4.425L11.5 0.0124997L14.15 2.6625L9.725 7.075Z" fill="white"/>
                        </svg>

                    </button>
                </div>
                <div class="mo-menu">
                    <div class="translation-mo">
                        <a href="#" class="on">KO</a>
                        <a href="#">EN</a>
                        <a href="#">JP</a>
                    </div>
                    <nav>
                        <div class="menu-list-wrap-mo">
                            <ul class="menu-list-mo">
                                <li class="menu">
                                    <a href="./studio.html">회사소개</a>
                                </li>
                                <li class="menu">
                                    <a href="./game.html">게임소개</a>
                                </li>
                                <li class="menu">
                                    <a href="./news.html">새소식</a>
                                </li>
                                <li class="menu">
                                    <a href="./career.html">채용</a>
                                </li>
                            </ul>
                        </div>
                    </nav>
                </div>
            </div>
        </div>
    </header>
    <div class="header-popup">
        <div class="notice-wrap">
            <p>Notice</p>
            <button class="popup-close">
                <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9.725 7.075L14.1375 11.4875L11.4875 14.1375L7.075 9.725L2.65 14.15L0 11.5L4.425 7.075L0 2.65L2.65 0L7.075 4.425L11.5 0.0124997L14.15 2.6625L9.725 7.075Z" fill="#1B1F33"/>
                </svg>
            </button>
        </div>
        <p>해당 기능은 준비 중입니다 :D</p>
    </div>

    <main>
        <section class="kv-sec">
            <img src="./assets/images/game-kvtest.png" alt="kv-img">
            <div class="kv-text container">
                <div data-aos="fade-up"
                data-aos-duration="1500">
                    <h2 class="kv-title">
                        루미드의 게임
                    </h2>
                    <p class="kv-sub">
                        일상에 작은 마법을 더하는 이야기
                    </p>
                </div>
            </div>
        </section>
    </main>
    
    <script src="assets/js/jquery.min.js"></script>
    <script src="./assets/js/common.js"></script>
    <script src="assets/js/script.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>
</html>
